name: continuous fuzz debugging

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each target
        required: false
        default: "900"

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target:
          - p2p_frame_and_protocol
          - p2p_session_state
          - transaction_and_block_codecs
          - transaction_and_block_differential
          - signer_and_stackerdb_codecs
          - checkpoint_manifests
          - checkpoint_import
          - marf_operations
          - clarity_wasm_abi
          - clarity_result_and_cost_differential
          - clarity_refusal_differential
          - clarity_stateful_receipt_differential
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: fuzz-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target

      - name: bounded continuous run
        env:
          NANO_FUZZ_SANITIZER: none
          NANO_FUZZ_TMP: ${{ runner.temp }}
          RUN_SECONDS: ${{ inputs.seconds || '900' }}
        run: nix develop --command scripts/fuzz.sh "${{ matrix.target }}" "$RUN_SECONDS"

      # Retention is split into observable steps: their pass/fail conclusions
      # are public run metadata, so a future failure names its own stage
      # without requiring authenticated access to the step logs.
      - name: commit a reproducible input to a durable branch
        id: retain
        if: failure()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if test -z "$(git status --porcelain -- "fuzz/corpus/$TARGET")"; then
            echo "retained=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          branch="fuzz-finding/$TARGET-$GITHUB_RUN_ID"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git switch -c "$branch"
          git add -- "fuzz/corpus/$TARGET"
          git commit -m "test(fuzz): retain $TARGET finding"
          echo "retained=true" >>"$GITHUB_OUTPUT"
          echo "branch=$branch" >>"$GITHUB_OUTPUT"

      - name: push the durable branch
        id: push
        if: failure() && steps.retain.outputs.retained == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.retain.outputs.branch }}
        # The push authenticates through its own header so it cannot depend on
        # whatever credentials the checkout step did or did not leave behind.
        run: |
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" \
            push origin "$BRANCH"

      - name: open a retention pull request
        if: failure() && steps.retain.outputs.retained == 'true' && steps.push.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ steps.retain.outputs.branch }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "test(fuzz): retain $TARGET finding" \
            --body "Automated reproducible input from workflow run $GITHUB_RUN_ID."

      - name: upload a convenience copy
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/corpus/${{ matrix.target }}/finding-*
          if-no-files-found: ignore
          retention-days: 30
