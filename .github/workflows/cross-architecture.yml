name: cross-architecture Epoch 4 debugging

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  execute:
    name: ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: epoch4-${{ matrix.architecture }}

      - name: execute the canonical corpus
        run: |
          mkdir -p report
          nix develop --command cargo run --profile ci \
            -p nano-adversarial --bin epoch4-corpus > report/epoch4.json
          (cd report && sha256sum -c \
            ../crates/nano-adversarial/corpus/epoch4-report.sha256)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: epoch4-${{ matrix.architecture }}
          path: report/epoch4.json
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: execute
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: epoch4-x86_64
          path: reports/x86_64

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: epoch4-aarch64
          path: reports/aarch64

      - name: compare every consensus-visible byte
        run: cmp reports/x86_64/epoch4.json reports/aarch64/epoch4.json
