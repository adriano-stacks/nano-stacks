# The gates a change has to pass before anybody reads a release report.
#
# Every job here runs offline: no capture, no mainnet state, no docker. That is the
# whole point of the bounded fixture -- the replay oracle is 340 blocks of
# stacks-core's own output, checked in, so a divergence is caught by a pull request
# rather than by a node that has been following mainnet for a day.
#
# Nothing here parses a table. `scoreboard` and `release-report` propagate failure
# through their exit status, which is what task 075 made true; a job that grepped
# their output for a word would go green the moment the wording changed.
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One toolchain, from the tracked lock file. A job that resolved `nixos-unstable`
# would build release evidence with a compiler nobody chose.
env:
  CARGO_TERM_COLOR: always
  NANO_CARGO_VERSION: 1.97.0
  NANO_CLIPPY_VERSION: 0.1.97
  NANO_RUSTFMT_VERSION: 1.9.0
  NANO_RUSTC_VERSION: 1.97.1

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: the lock file and exact Rust release decide the toolchain
        run: |
          configured=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test "$configured" = "$NANO_RUSTC_VERSION"
          test "$(nix develop --command rustc --version | awk '{print $2}')" = "$NANO_RUSTC_VERSION"
          test "$(nix develop --command cargo --version | awk '{print $2}')" = "$NANO_CARGO_VERSION"
          test "$(nix develop --command cargo clippy --version | awk '{print $2}')" = "$NANO_CLIPPY_VERSION"
          test "$(nix develop --command rustfmt --version | awk '{print $2}' | cut -d- -f1)" = "$NANO_RUSTFMT_VERSION"
          git diff --exit-code flake.lock

      - uses: Swatinem/rust-cache@v2

      - name: workflow syntax
        run: nix develop --command actionlint

      - name: formatting
        # The script covers both Cargo workspaces; root `cargo fmt` cannot see
        # the independently vendored clarity-wasm workspace.
        run: nix develop --command scripts/fmt.sh --check

      - name: clippy, release profile, every target
        run: |
          nix develop --command cargo clippy --release --workspace --all-targets -- -D warnings
          nix develop --command cargo clippy --manifest-path vendor/clarity-wasm/Cargo.toml \
            --release -p clar2wasm --all-targets -- -D warnings

      - name: the bounded fixture replay, as a gate
        run: nix develop --command cargo xtask scoreboard

      - name: fixture integrity
        run: nix develop --command cargo xtask validate-fixtures

      - name: the conformance suite
        run: nix develop --command cargo test --release -p nano-conformance --test conformance

      - name: unit tests
        run: nix develop --command cargo test --release --workspace

      # The report still builds and inspects the release artifact, checks the
      # ignored/conditional inventory and consumes the scoreboard verdict. It does
      # not pretend that this offline runner has the mainnet and Hacknet inputs.
      - name: offline release evidence
        run: |
          set +e
          nix develop --command cargo xtask release-report --no-gates
          status=$?
          set -e
          test "$status" -eq 2

      - name: gates leave every pinned input unchanged
        run: git diff --exit-code -- flake.lock Cargo.lock vendor/clarity-wasm/Cargo.lock

  # Release qualification is deliberately not a push/PR job. It needs large
  # captured state, a live mainnet route and stock Hacknet services; pretending a
  # hosted runner has those made every ordinary workflow structurally red. The
  # self-hosted runner's `nano-mainnet-release` environment supplies the NANO_*
  # paths and endpoints named by `.github/release.env.example` and the inventories.
  # Missing any one remains
  # a failed `skip_gate` because release-report sets NANO_REQUIRE_MAINNET.
  release-qualification:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, nano-mainnet-release]
    environment: nano-mainnet-release
    env:
      NANO_RELEASE_ENV: ${{ vars.NANO_RELEASE_ENV }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: the qualification runner declares its input bundle
        run: test -n "${NANO_RELEASE_ENV:-}" && test -r "$NANO_RELEASE_ENV"

      - name: capture-backed release report
        run: |
          set -a
          # shellcheck source=/dev/null
          . "$NANO_RELEASE_ENV"
          set +a

          scratch_dirs=()
          cleanup() {
            status=$?
            trap - EXIT
            for directory in "${scratch_dirs[@]}"; do
              rm -rf -- "$directory"
            done
            exit "$status"
          }
          trap cleanup EXIT

          test -n "${NANO_RELEASE_TMP:-}"
          mkdir -p "$NANO_RELEASE_TMP"
          test "$(stat -c %d "$NANO_RELEASE_TMP")" = "$(stat -c %d "$NANO_MAINNET_MARF")"
          qualification_tmp=$(mktemp -d "$NANO_RELEASE_TMP/.qualification.XXXXXX")
          scratch_dirs+=("$qualification_tmp")
          export TMPDIR="$qualification_tmp"

          fresh_reflink() {
            id=$1
            source_name="NANO_${id}_SOURCE"
            scratch_name="NANO_${id}_SCRATCH"
            source=${!source_name}
            template=${!scratch_name}
            test -d "$source"
            parent=$(dirname "$template")
            mkdir -p "$parent"
            directory=$(mktemp -d "$parent/.$(basename "$template").XXXXXX")
            scratch_dirs+=("$directory")
            cp -a --reflink=always "$source/." "$directory/"
            printf -v "$scratch_name" %s "$directory"
            export "${scratch_name?}"
          }

          fresh_reflink 052
          fresh_reflink 064
          fresh_reflink 086
          fresh_reflink 098
          fresh_reflink 111
          nix develop --command cargo xtask release-report \
            --capture "$NANO_MAINNET_CAPTURE" --state "$NANO_MAINNET_STATE"
