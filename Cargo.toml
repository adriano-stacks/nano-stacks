[workspace]
resolver = "2"
members = [
    "crates/nano-primitives",
    "crates/nano-consensus-profile",
    "crates/nano-crypto",
    "crates/nano-address",
    "crates/nano-codec",
    "crates/nano-bitcoin",
    "crates/nano-sortition",
    "crates/nano-marf",
    "crates/nano-mempool",
    "crates/nano-queue",
    "crates/nano-vm",
    "crates/nano-wasm-cache",
    "crates/nano-oracle",
    "crates/nano-chainstate",
    "crates/nano-p2p",
    "crates/nano-sync",
    "crates/nano-follower",
    "crates/nano-stackerdb",
    "crates/nano-signer",
    "crates/nano-miner",
    "crates/nano-node",
    "crates/nano-rpc",
    "crates/nano-tui",
    "crates/nano-adversarial",
    "crates/nano-conformance",
    "xtask",
]
exclude = [
    "compatibility/epoch4-stock-runner/6d58b498",
    "compatibility/epoch4-stock-runner/efc34a07",
    "vendor/clarity-wasm",
]
default-members = ["crates/nano-node", "crates/nano-conformance", "xtask"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/stacks-network/nano-stacks"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Every fallible function here returns a domain error whose variants say more
# than a prose section would, and the panics are `expect`s on invariants the
# surrounding code has just established. Documenting either would be noise.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `BitcoinBlockContext` is `Copy` on purpose: one block's burn facts, threaded down
# the execution path and read at a dozen depths, where every read wants a value and
# not a lifetime. Carrying the tenure's own burn height beside the view's -- the
# distinction pox-5 height 931 turned on -- took it past the 256-byte advice, and the
# advice is wrong for this type: the copy is a memcpy beside executing a block's
# transactions, and a reference would put a borrow across the `&mut self` that
# execution already holds.
large_types_passed_by_value = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The loop profile: release code generation with incremental compilation on.
#
# Everything here is built `--release`, because the node executes mainnet blocks
# and a debug build is too slow to replay with. That makes the write/test loop
# pay full LLVM optimization across roughly sixty downstream units for a one-line
# change -- 353 s of CPU, of which the edited crate is 12.
#
# `incremental = true` is deliberately *not* on `[profile.release]`. It changes
# how rustc partitions codegen units, which limits cross-unit inlining, and this
# node's replay throughput is a thing worth measuring before trading. So it lives
# in a separate profile: iterate with `--profile loop`, and let the release
# profile stay the one whose numbers mean something.
#
# Measured steady state with it on: the node binary 12.6 s -> 2.8 s, `nano-vm`
# 3.9 s -> 0.5 s. The cost is one cold build and about 10-15 GB.
[profile.loop]
inherits = "release"
incremental = true

# Thin LTO and one codegen unit: measured on the 4,149-block mainnet replay
# together with the allocator, and kept because the node is the same hot code.
# `--profile loop` stays the fast-iteration escape hatch.
[profile.release]
lto = "thin"
codegen-units = 1

# CI tests need release runtime semantics, not production link-time optimization.
[profile.ci]
inherits = "release"
lto = "off"
codegen-units = 16
