[workspace]
resolver = "2"
members = [
    "crates/nano-primitives",
    "crates/nano-crypto",
    "crates/nano-address",
    "crates/nano-codec",
    "crates/nano-bitcoin",
    "crates/nano-sortition",
    "crates/nano-marf",
    "crates/nano-mempool",
    "crates/nano-vm",
    "crates/nano-oracle",
    "crates/nano-chainstate",
    "crates/nano-sync",
    "crates/nano-stackerdb",
    "crates/nano-signer",
    "crates/nano-miner",
    "crates/nano-node",
    "crates/nano-rpc",
    "crates/nano-conformance",
    "xtask",
]
default-members = ["crates/nano-node", "crates/nano-conformance", "xtask"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/stacks-network/nano-stacks"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Every fallible function here returns a domain error whose variants say more
# than a prose section would, and the panics are `expect`s on invariants the
# surrounding code has just established. Documenting either would be noise.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
