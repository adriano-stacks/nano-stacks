[package]
name = "clar2wasm"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
clap = { version = "4.3.17", features = ["derive"] }
regex = "1.9.1"
walrus = "0.20.1"
lazy_static = "1.4.0"
wasmtime = "15.0.0"
sha2 = { version = "0.10.7" }
chrono = { version = "0.4.20" }
rusqlite = { version = "0.31.0" }
serde_json = "1"

# No `testing` feature here: Cargo unifies features across a build graph, so
# enabling it on a normal dependency enables it for `clarity`, `clarity-types`
# and `stacks-common` inside every binary built from this crate -- including a
# release node, which must observe the real schedules and no test override. The
# crosscheck harness needs it and asks for it as a dev-dependency below.
clarity = { git = "https://github.com/stacks-network/stacks-core.git", rev = "efc34a07a225c4b950ab9404a1652aa5e14affaf" }
# See nano-vm's copy of this line: the default enables `ctrlc-handler`, which
# nothing calls, and feature unification would put it in every binary built from
# this crate. `developer-mode` is kept deliberately.
stacks-common = { git = "https://github.com/stacks-network/stacks-core.git", rev = "efc34a07a225c4b950ab9404a1652aa5e14affaf", default-features = false, features = ["developer-mode", "rand"] }
clarity-types = { git = "https://github.com/stacks-network/stacks-core.git", rev = "efc34a07a225c4b950ab9404a1652aa5e14affaf" }

[build-dependencies]
wat = "1.0.74"

[features]
flamegraph = []
pb = []

# Test-specific features

# Clarity version to test - default v2
test-clarity-v1 = []
test-clarity-v2 = []
test-clarity-v3 = []
test-clarity-v4 = []
developer-mode = []

[dev-dependencies]
clar2wasm = {path = ".", features = ["developer-mode"]}
clarity = { git = "https://github.com/stacks-network/stacks-core.git", rev = "efc34a07a225c4b950ab9404a1652aa5e14affaf", features = ["testing"] }
criterion = "0.5"
proptest = "1.2.0"
num-integer = { version = "0.1.45", default-features = false }
hex = "0.4.3"
pprof = { version = "0.14", features = [
  "flamegraph",
  "protobuf-codec",
  "criterion",
  "frame-pointer",
] }
assert_fs = "1.1.1"
assert_cmd = "2.0.14"
wasmparser = "0.207.0"
predicates = "3.1.0"
paste = "1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "clar2wasm"
path = "src/bin/main.rs"

[[bin]]
name = "crosscheck"
path = "src/bin/crosscheck.rs"

[[bench]]
name = "comparison"
harness = false

[lints.clippy]
result_large_err = "allow"
