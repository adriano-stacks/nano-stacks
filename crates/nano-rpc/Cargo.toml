[package]
name = "nano-rpc"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.9"
clarity = { git = "https://github.com/stacks-network/stacks-core.git", rev = "efc34a07a225c4b950ab9404a1652aa5e14affaf" }
hex = "0.4.3"
nano-address = { path = "../nano-address" }
nano-chainstate = { path = "../nano-chainstate" }
nano-codec = { path = "../nano-codec" }
nano-crypto = { path = "../nano-crypto" }
nano-mempool = { path = "../nano-mempool" }
nano-primitives = { path = "../nano-primitives" }
nano-stackerdb = { path = "../nano-stackerdb" }
nano-sync = { path = "../nano-sync" }
nano-vm = { path = "../nano-vm" }
prometheus-client = "0.25.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
siphasher = "0.3.11"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
