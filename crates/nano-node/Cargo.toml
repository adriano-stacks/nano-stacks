[package]
name = "nano-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
mimalloc = "0.1"
bitcoin = "0.32.8"
bitcoincore-rpc = "0.19.0"
clap = { version = "4.6.4", features = ["derive"] }
fs2 = "0.4.3"
clarity = { git = "https://github.com/stacks-network/stacks-core.git", rev = "efc34a07a225c4b950ab9404a1652aa5e14affaf" }
hex = "0.4.3"
nano-address = { path = "../nano-address" }
nano-bitcoin = { path = "../nano-bitcoin" }
nano-chainstate = { path = "../nano-chainstate" }
nano-codec = { path = "../nano-codec" }
nano-consensus-profile = { path = "../nano-consensus-profile" }
nano-crypto = { path = "../nano-crypto" }
nano-follower = { path = "../nano-follower", features = ["node-adapters"] }
nano-marf = { path = "../nano-marf" }
nano-mempool = { path = "../nano-mempool" }
nano-miner = { path = "../nano-miner" }
nano-primitives = { path = "../nano-primitives" }
nano-queue = { path = "../nano-queue" }
nano-rpc = { path = "../nano-rpc" }
nano-signer = { path = "../nano-signer" }
nano-sortition = { path = "../nano-sortition" }
nano-stackerdb = { path = "../nano-stackerdb" }
nano-p2p = { path = "../nano-p2p" }
nano-sync = { path = "../nano-sync" }
nano-vm = { path = "../nano-vm" }
reqwest = { version = "0.13.4", default-features = false }
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.8"

[lints]
workspace = true

[[bin]]
name = "stacks-node"
path = "src/main.rs"

[dev-dependencies]
nano-follower = { path = "../nano-follower", features = ["node-adapters", "test-support"] }
tempfile = "3"
