[package]
name = "nano-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "nano-tui"
path = "src/main.rs"

[dependencies]
# The node's own decoder, so a block shown here is a block read the way the node
# reads it rather than a second opinion about the same bytes.
nano-codec = { path = "../nano-codec" }
nano-chainstate = { path = "../nano-chainstate" }
nano-primitives = { path = "../nano-primitives" }
clarity = { git = "https://github.com/stacks-network/stacks-core.git", rev = "efc34a07a225c4b950ab9404a1652aa5e14affaf" }
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29"
hex = "0.4.3"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "2.12", default-features = false, features = ["json", "gzip"] }
url = "2.5.8"

[lints]
workspace = true
