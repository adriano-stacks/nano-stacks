[package]
name = "nano-adversarial"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
clar2wasm = { path = "../../vendor/clarity-wasm/clar2wasm" }
clarity = { git = "https://github.com/stacks-network/stacks-core.git", rev = "efc34a07a225c4b950ab9404a1652aa5e14affaf" }
stacks-common = { git = "https://github.com/stacks-network/stacks-core.git", rev = "efc34a07a225c4b950ab9404a1652aa5e14affaf" }
stackslib = { git = "https://github.com/stacks-network/stacks-core.git", rev = "efc34a07a225c4b950ab9404a1652aa5e14affaf" }
nano-chainstate = { path = "../nano-chainstate", default-features = false }
nano-codec = { path = "../nano-codec" }
nano-crypto = { path = "../nano-crypto" }
nano-marf = { path = "../nano-marf" }
nano-oracle = { path = "../nano-oracle" }
nano-p2p = { path = "../nano-p2p" }
nano-primitives = { path = "../nano-primitives" }
nano-stackerdb = { path = "../nano-stackerdb" }
nano-vm = { path = "../nano-vm", default-features = false }
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "time"] }
toml = "1.1.3"

[dev-dependencies]
hex = "0.4.3"

[lints]
workspace = true
