[package]
name = "nano-vm"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
wasmtime = "15.0.0"
clar2wasm = { path = "../../vendor/clarity-wasm/clar2wasm" }
clarity = { git = "https://github.com/stacks-network/stacks-core.git", rev = "efc34a07a225c4b950ab9404a1652aa5e14affaf" }
hex = "0.4.3"
nano-marf = { path = "../nano-marf" }
nano-primitives = { path = "../nano-primitives" }
nano-wasm-cache = { path = "../nano-wasm-cache" }
rusqlite = { version = "0.31.0", features = ["bundled"] }
# `default-features = false` and the list spelled out: `stacks-common`'s own
# default adds `ctrlc-handler`, which drags in `nix` and installs nothing nano
# calls, and a future default could add more without anyone here choosing it.
# `developer-mode` is chosen on purpose -- it keeps source spans on AST nodes, so
# a stock mainnet node has it and nano's parser must report the same way.
stacks-common = { git = "https://github.com/stacks-network/stacks-core.git", rev = "efc34a07a225c4b950ab9404a1652aa5e14affaf", default-features = false, features = ["developer-mode", "rand"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
