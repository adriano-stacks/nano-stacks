[package]
name = "nano-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
nano-address = { path = "../nano-address" }
nano-chainstate = { path = "../nano-chainstate" }
nano-codec = { path = "../nano-codec" }
nano-crypto = { path = "../nano-crypto" }
nano-mempool = { path = "../nano-mempool" }
lru = "0.18.2"
nano-primitives = { path = "../nano-primitives" }
nano-sortition = { path = "../nano-sortition" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
