[package]
name = "nano-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nano-chainstate = { path = "../nano-chainstate" }
nano-primitives = { path = "../nano-primitives" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
