[package]
name = "epoch4-consensus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# The deterministic Epoch 4.0 decision boundary. Nothing here may depend on
# Tokio, HTTP, sockets or a wall clock: the decision path is a pure function of
# request bytes and the state directory, which is what lets a supervised
# executor process host it and a shadow run compare it.
[dependencies]
nano-bitcoin = { path = "../nano-bitcoin" }
nano-chainstate = { path = "../nano-chainstate" }
nano-primitives = { path = "../nano-primitives" }
nano-vm = { path = "../nano-vm", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
hex = "0.4.3"

[lints]
workspace = true
