[package]
name = "nano-follower"
version = "0.1.0"
edition.workspace = true
license.workspace = true
autobins = false

[features]
default = []
node-rpc = ["dep:nano-rpc"]
node-adapters = [
    "node-rpc",
    "dep:clarity",
    "dep:nano-mempool",
    "dep:nano-miner",
]
test-support = ["dep:tempfile"]

[dependencies]
clarity = { git = "https://github.com/stacks-network/stacks-core.git", rev = "efc34a07a225c4b950ab9404a1652aa5e14affaf", optional = true }
clap = { version = "4.6.4", features = ["derive"] }
fs2 = "0.4.3"
getrandom = "0.3.4"
hex = "0.4.3"
mimalloc = "0.1"
nano-address = { path = "../nano-address" }
nano-bitcoin = { path = "../nano-bitcoin" }
nano-chainstate = { path = "../nano-chainstate" }
nano-codec = { path = "../nano-codec" }
nano-consensus-profile = { path = "../nano-consensus-profile" }
nano-crypto = { path = "../nano-crypto" }
nano-marf = { path = "../nano-marf" }
nano-mempool = { path = "../nano-mempool", optional = true }
nano-miner = { path = "../nano-miner", optional = true }
nano-p2p = { path = "../nano-p2p" }
nano-primitives = { path = "../nano-primitives" }
nano-rpc = { path = "../nano-rpc", optional = true }
nano-sortition = { path = "../nano-sortition" }
nano-sync = { path = "../nano-sync", default-features = false }
nano-vm = { path = "../nano-vm" }
reqwest = { version = "0.13.4", default-features = false }
rusqlite = { version = "0.31.0", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.8"
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "stacks-follower"
path = "src/main.rs"
