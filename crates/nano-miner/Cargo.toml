[package]
name = "nano-miner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
autobins = false

[dependencies]
bitcoin = "0.32.8"
bitcoincore-rpc = "0.19.0"
clap = { version = "4.6.4", features = ["derive"] }
hex = "0.4.3"
nano-address = { path = "../nano-address" }
nano-bitcoin = { path = "../nano-bitcoin" }
nano-chainstate = { path = "../nano-chainstate" }
nano-codec = { path = "../nano-codec" }
nano-crypto = { path = "../nano-crypto" }
nano-mempool = { path = "../nano-mempool" }
nano-primitives = { path = "../nano-primitives" }
nano-sortition = { path = "../nano-sortition" }
nano-stackerdb = { path = "../nano-stackerdb" }
nano-sync = { path = "../nano-sync" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.4", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true

# The Bitcoin one-shots that give a miner its identity, which a node needs done
# before it can start: registering a leader key, and paying a commitment.
[[bin]]
name = "stacks-register-leader-key"
path = "src/bin/register_leader_key.rs"
