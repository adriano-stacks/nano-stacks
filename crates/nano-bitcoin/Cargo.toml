[package]
name = "nano-bitcoin"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bitcoin = "0.32.8"
bitcoincore-rpc = "0.19.0"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
nano-address = { path = "../nano-address" }
nano-crypto = { path = "../nano-crypto" }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"

[dev-dependencies]
nano-primitives = { path = "../nano-primitives" }

[lints]
workspace = true
