[package]
name = "nano-signer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
atomicwrites = "0.4.4"
axum = "0.8.9"
clap = { version = "4.6.4", features = ["derive"] }
fs2 = "0.4.3"
hex = "0.4.3"
nano-address = { path = "../nano-address" }
nano-bitcoin = { path = "../nano-bitcoin" }
nano-crypto = { path = "../nano-crypto" }
nano-primitives = { path = "../nano-primitives" }
nano-stackerdb = { path = "../nano-stackerdb" }
nano-sync = { path = "../nano-sync" }
nano-chainstate = { path = "../nano-chainstate" }
reqwest = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true

[[bin]]
name = "stacks-signer"
path = "src/main.rs"
