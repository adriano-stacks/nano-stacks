# Every `#[ignore]` in this workspace and in the vendored compiler, accounted for.
#
# The release report used to decide whether an ignored test was infrastructure or
# a Clarity differential by looking for substrings in its reason -- and one of the
# markers it looked for was `needs to be implemented`, which classified "Clarity 4
# costs needs to be implemented" as an environment problem. A reason string is
# prose; it is not a policy. This file is the policy, and the report reads it.
#
# Keyed by the exact reason text. An `#[ignore]` whose reason is not listed here
# is `unclassified`, which the release report treats the same as `semantic`: a
# failed gate. That is the source-level gate task 085 asks for -- a new ignore
# cannot be added without appearing here with an owner.
#
# class:
#   infrastructure  a required behaviour that needs a service, network or fixture
#                   this machine does not have. Must name the job that supplies it,
#                   and that job must have run before task 053 can pass.
#   semantic        a disagreement about what Clarity means, or any consensus,
#                   cost, receipt or state differential. A failed release gate now.
#   tool            a developer aid that asserts no required behaviour. Owned and
#                   listed, but nothing has to run it.
#   unclassified    nobody has decided yet. Treated as `semantic` on purpose, so
#                   the undecided case cannot be the quiet one.

[[ignored]]
reason = "Clarity 4 costs needs to be implemented"
class = "semantic"
owner = "023"
note = """
The one this task was opened over. `clar2wasm`'s own cost suite skips Clarity 4,
which is the cost schedule epoch 4.0 runs under -- a cost decides block admission
even where the state root matches, so this is a differential and not a chore.
"""

[[ignored]]
reason = "test system needs to be improved relative to versioning and epochs"
class = "unclassified"
owner = "060"
note = """
Twelve sites in the vendored compiler's own suite. The reason describes the
harness rather than the answer, so it may be hiding nothing or may be hiding a
per-epoch differential; nobody has looked. Unclassified rather than assumed
benign, which is what the substring rule did.
"""

[[ignored]]
reason = "block-reward is not simulated in the test framework"
class = "unclassified"
owner = "060"
note = """
Two sites. Same reasoning: a test framework that cannot pay a block reward is an
infrastructure statement, but what the skipped assertions cover has not been
checked against nano's own coinbase and maturity gates.
"""

