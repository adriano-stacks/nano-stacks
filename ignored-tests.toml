class = "out-of-scope"
owner = "066"
covered_by = "nano-conformance as_contract_sender, as_contract_codegen, allowance_principal"
measured = """
`UnknownFunction("as-contract")`, in both engines. clarity's own registry settles
it: `AsContract("as-contract", ClarityVersion::Clarity1, Some(ClarityVersion::Clarity3))`
-- the word runs Clarity 1 through 3 and is removed after, replaced by
`as-contract?`. The harness runs at Clarity 6. Nano covers `as-contract` at the
versions where it exists (`as_contract_sender`, at Clarity 3, which matters
because task 064 compiles an old contract under its deployment epoch) and
`as-contract?` in `allowance_principal` and `as_contract_codegen`.
"""

