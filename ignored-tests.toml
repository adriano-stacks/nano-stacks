# Every `#[ignore]` in this workspace and in the vendored compiler, accounted for.
#
# The release report used to decide whether an ignored test was infrastructure or
# a Clarity differential by looking for substrings in its reason -- and one of the
# markers it looked for was `needs to be implemented`, which classified "Clarity 4
# costs needs to be implemented" as an environment problem. A reason string is
# prose; it is not a policy. This file is the policy, and the report reads it.
#
# **Keyed by the test's own name, not by its reason.** Twelve sites share the
# wording "test system needs to be improved relative to versioning and epochs" and
# they are not one thing: some are words epoch 4.0 removed, and some are
# `asserts!` and `as-contract`, which epoch 4.0 very much has. One key for both
# would have classified the second by the first, which is the same mistake as the
# substring rule wearing a different hat.
#
# A test not listed here is `unclassified`, which the release report treats the
# same as `semantic`: a failed gate. That is the source-level gate task 085 asks
# for -- a new ignore cannot be added without appearing here with an owner.
#
# `class` is also the release policy. `infrastructure`, `semantic` and
# `unclassified` are blocking; `covered`, `out-of-scope` and `tool` are allowed
# only with the evidence named below.
#
# class:
#   infrastructure  a required behaviour that needs a service, network or fixture
#                   this machine does not have. Names the job that supplies it,
#                   and that job must have run before task 053 can pass.
#   out-of-scope    the behaviour does not exist in epoch 4.0, and nano's own gate
#                   for what 4.0 *does* do is named. Not blocking.
#   covered         this harness cannot express the behaviour, and an unconditional
#                   replacement gate is named. Not blocking.
#   semantic        a disagreement about what Clarity means, or any consensus,
#                   cost, receipt or state differential. A failed release gate now.
#   tool            a developer aid that asserts no required behaviour.
#   unclassified    nobody has decided. Treated as `semantic` on purpose, so the
#                   undecided case cannot be the quiet one.
#
# Every entry below was classified by *running* the ignored test and reading what
# it actually did, 2026-08-07 (`cargo test -p clar2wasm --all-features -- --ignored`).
# None of it is inferred from the reason text.

# ---------------------------------------------------------------------------
# semantic: live epoch-4.0 behaviour, measured to differ or to be uncovered.
# ---------------------------------------------------------------------------

[[ignored]]
test = "get_tenure_info_block_reward"
class = "covered"
owner = "060"
covered_by = "nano-conformance tenure_block_reward"
measured = """
`(get-tenure-info? block-reward u0)` answers `none` against an expected
`(some u0)`, because that harness cannot simulate a block reward -- a true
statement about it, and it used to leave a live epoch-4.0 Clarity read
uncovered in both directions.

Nano can simulate it, because nano's headers carry the number:
`get_tokens_earned_for_block` reads `BlockHeader::block_reward` off the header a
block was sealed with. `tenure_block_reward` builds a chain whose tenures earn
different amounts and crosschecks the compiler against the reference interpreter
for every one of them, plus `miner-spend-total` beside it. So the *behaviour* is
gated even though this test cannot be.
"""

[[ignored]]
test = "element_at_does_not_widen_the_element_it_extracts"
class = "semantic"
owner = "150"
measured = """
`element-at?` on a list whose elements carry a widened runtime shape charges the
element's whole declared width, where the reference charges the extracted
element as what it holds -- `cost_print [6]` against the compiler's 192,006 on a
`(list 12000 uint)` holding nothing. Measured identically with and without the
`list` constructor capture that was tried and reverted, so it is an
extraction-side defect on its own.

It *over*-charges, which is the direction that refuses a block the network
accepted -- the same failure mode as block 8,832,029 -- so it matters more than
its size suggests. Cost only; the value is right.
"""

# ---------------------------------------------------------------------------
# out-of-scope: the word does not exist in Clarity 6, measured.
# ---------------------------------------------------------------------------
#
# Every one of these fails with `use of unresolved function`, in *both* engines,
# because the harness runs at epoch 4.0 / Clarity 6 where the word was removed --
# it says so itself: "Provided epoch (4.0) and Clarity version (Clarity 1) do not
# match. Defaulting to epoch (4.0) and Clarity version (Clarity 6)". A contract
# using one of these fails analysis in both engines on a 4.0 chain, so nothing
# here can reach a receipt. What epoch 4.0 *does* do with `at-block` in a contract
# deployed under an older epoch is nano's own gate,
# `nano-conformance`'s `at_block_refusal`, which runs unconditionally.
#
# The two engines' error envelopes differ (`Compilation failure Generic { .. }`
# against `StaticCheckError { UnknownFunction }`) around the identical diagnostic.
# Recorded because it is a real difference; not blocking because it is an analysis
# refusal of a word 4.0 does not have, and both engines refuse.

[[ignored]]
test = "at_block_var"
class = "out-of-scope"
owner = "066"
covered_by = "nano-conformance at_block_refusal"

[[ignored]]
test = "get_block_info_block_reward"
class = "out-of-scope"
owner = "066"
covered_by = "nano-conformance tenure_block_reward"
measured = """
`use of unresolved function 'get-block-info?'`. Clarity 6 replaced it with
`get-stacks-block-info?` and `get-tenure-info?`. The `block-reward` field itself
is still live and is covered by `get_tenure_info_block_reward` above, which is
classified `semantic`.
"""

[[ignored]]
test = "a_contract_of_trait_calls_compiles_at_size"
