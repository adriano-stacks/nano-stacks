class = "out-of-scope"
owner = "066"
measured = """
`use of unresolved function 'get-block-info?'`. Clarity 6 replaced it with
`get-stacks-block-info?` and `get-tenure-info?`. The `block-reward` field itself
is still live and is covered by `get_tenure_info_block_reward` above, which is
classified `semantic`.
"""

[[ignored]]
