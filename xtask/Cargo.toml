[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
hex = "0.4.3"
nano-conformance = { path = "../crates/nano-conformance" }
nano-consensus-profile = { path = "../crates/nano-consensus-profile" }
nano-primitives = { path = "../crates/nano-primitives" }
nano-chainstate = { path = "../crates/nano-chainstate" }
nano-crypto = { path = "../crates/nano-crypto" }
nano-vm = { path = "../crates/nano-vm" }
nano-oracle = { path = "../crates/nano-oracle" }
nano-marf = { path = "../crates/nano-marf" }
nano-bitcoin = { path = "../crates/nano-bitcoin" }
nano-codec = { path = "../crates/nano-codec" }
nano-node = { path = "../crates/nano-node" }
wasmprinter = "0.207"
clarity = { git = "https://github.com/stacks-network/stacks-core.git", rev = "efc34a07a225c4b950ab9404a1652aa5e14affaf" }
serde_json = "1.0.151"
rusqlite = { version = "0.31.0", features = ["bundled"] }
nano-sync = { path = "../crates/nano-sync" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
time = { version = "0.3.54", features = ["parsing"] }

[dev-dependencies]
nano-sortition = { path = "../crates/nano-sortition" }

[lints]
workspace = true
